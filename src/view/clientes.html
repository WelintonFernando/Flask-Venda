<!DOCTYPE html>
                    <html lang="pt-BR">
                    <head>
                        <meta charset="UTF-8">
                        <title>Cadastro de Clientes</title>
                        <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
                        <link href="https://fonts.googleapis.com/css2?family=Jacquard+12&display=swap" rel="stylesheet">
                    </head>
                    <body>
                        <div class="container">
                            <header>
                                <h1>Cadastro de Clientes</h1>
                                <hr>
                            </header>

                            <div class="content">
                                <!-- Formulário de Cadastro -->
                                <section class="cadastro-produto">
                                    <h2>Cadastrar novo cliente</h2>
                                    <form action="/salvar_cliente" method="POST" class="form-produto">
                                        <div class="form-group">
                                            <input type="text" name="nome" placeholder="Nome" value="{{nome}}" required>
                                            <input type="text" name="endereco" placeholder="Endereço" value="{{endereco}}" required>
                                        </div>
                                        <div class="form-group">
                                            <input type="text" name="codigo" placeholder="codigo" value="{{codigo}}" class="input-codigo" readonly>
                                        </div>

                                        <div class="buttons-form">
                                            <a href="/" class="btn">Voltar</a>
                                            <button type="submit" class="btn">Cadastrar</button>
                                        </div>
                                    </form>
                                </section>

                                <!-- Tabela de Clientes -->
                                <section class="produtos-cadastrados">
                                    <h2>Cadastrados</h2>
                                    <div class="tabela-container">
                                        <table class="produtos-tabela">
                                            <thead>
                                                <tr>
                                                    <th>Código</th>
                                                    <th>Nome</th>
                                                    <th>Endereço</th>
                                                    <th>Alterar</th>
                                                    <th>Remover</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                {% for cliente in clientes %}
                                                <tr>
                                                    <td>{{ cliente.codcliente }}</td>
                                                    <td>{{ cliente.nome }}</td>
                                                    <td>{{ cliente.endereco }}</td>
                                                    <td><a href="/alterar_cliente/{{ cliente.codcliente }}" class="btn-tabela">Alterar</a></td>
                                                    <td><a href="/remover_cliente/{{ cliente.codcliente }}" class="btn-tabela">Remover</a></td>
                                                </tr>
                                                {% endfor %}
                                            </tbody>
                                        </table>
                                    </div>

                                    <!-- Barra de Pesquisa -->
                                    <div class="input-pesquisa">
                                        <form action="/pesquisar_cliente" method="POST">
                                            <input type="text" name="termo" placeholder="Pesquisar">
                                            <button type="submit" class="search-button">
                                                <img src="{{ url_for('static', filename='img/search.png') }}" alt="Pesquisar">
                                            </button>
                                        </form>
                                    </div>
                                </section>
                            </div>
                        </div>
                    </body>
                    </html>
